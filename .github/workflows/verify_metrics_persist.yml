name: Verify Metrics Persistence

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      METRICS_PERSIST: '1'
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      DATABASE_URL: sqlite:///./verify_metrics.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Resolve database URL
        shell: bash
        run: |
          if [ -n "${STAGING_DATABASE_URL}" ]; then
            echo "DATABASE_URL=${STAGING_DATABASE_URL}" >> "$GITHUB_ENV"
            echo "Using STAGING_DATABASE_URL for staging validation."
          else
            echo "DATABASE_URL=sqlite:///./verify_metrics.db" >> "$GITHUB_ENV"
            echo "STAGING_DATABASE_URL is not configured; falling back to SQLite for local-only validation."
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install sqlalchemy psycopg2-binary
      - name: Run verify script
        run: |
          python -u scripts/verify_metrics_persist.py
      - name: Query persisted metrics
        if: success()
        run: |
          python - <<'PY'
          import os
          db = os.environ['DATABASE_URL']
          print(f"DATABASE_URL={db}")
          if db.startswith('postgres'):
              import psycopg2
              conn = psycopg2.connect(db)
              cur = conn.cursor()
              cur.execute('SELECT COUNT(*) FROM provider_metric_samples;')
              print('COUNT:', cur.fetchone()[0])
              cur.execute('SELECT provider, model, latency_ms, success_rate FROM provider_metric_samples ORDER BY id DESC LIMIT 5;')
              print(cur.fetchall())
              conn.close()
          elif db.startswith('sqlite'):
              import sqlite3
              path = db.replace('sqlite:///', '', 1)
              conn = sqlite3.connect(path)
              print('COUNT:', conn.execute('SELECT COUNT(*) FROM provider_metric_samples').fetchone()[0])
              print(conn.execute('SELECT provider, model, latency_ms, success_rate FROM provider_metric_samples ORDER BY id DESC LIMIT 5').fetchall())
              conn.close()
          else:
              print('Configured DB is not SQLite or PostgreSQL; use the appropriate DB client for your database.')
          PY
      - name: Fail when staging secret is missing
        if: ${{ env.STAGING_DATABASE_URL == '' }}
        run: |
          echo "STAGING_DATABASE_URL is not configured. This workflow falls back to SQLite and should not be treated as staging validation."
          exit 1
      - name: Upload verification database artifact
        if: ${{ always() && hashFiles('verify_metrics.db') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-metrics-db
          path: verify_metrics.db
          if-no-files-found: ignore
