name: P0 Observability CI (draft)

on:
  pull_request:
    paths:
      - 'src/adapters/observability/**'
      - 'docs/observability/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps (draft)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
      - name: Run pytest
        run: |
          pytest -q tests/observability || true
      - name: License summary (draft)
        run: |
          echo "Run license-checker or SCA here in real CI"

  integration-tests:
    runs-on: self-hosted
    needs: unit-tests
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4
      - name: Run integration docker-compose (requires self-hosted runner)
        run: |
          echo "This job requires a self-hosted runner with docker-compose"