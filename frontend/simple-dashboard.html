<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiuHao AI-OS - CEO 控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        * { box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // API Service
        const API_BASE = '/api/v1';
        
        const api = {
            login: async (username, password) => {
                const res = await axios.post(`${API_BASE}/auth/login`, { username, password });
                localStorage.setItem('token', res.data.access_token);
                return res.data;
            },
            getEmployees: async () => {
                const token = localStorage.getItem('token');
                const res = await axios.get(`${API_BASE}/workforce/employees`, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                return res.data;
            },
            createEmployee: async (data) => {
                const token = localStorage.getItem('token');
                const res = await axios.post(`${API_BASE}/workforce/employees`, data, {
                    headers: { Authorization: `Bearer ${token}` }
                });
                return res.data;
            },
            getHealth: async () => {
                const res = await axios.get(`${API_BASE}/health/`);
                return res.data;
            }
        };

        // Login Page
        function LoginPage({ onLogin }) {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setError('');
                setLoading(true);
                try {
                    await api.login(username, password);
                    onLogin();
                } catch (err) {
                    setError('登录失败，请检查用户名和密码');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-50 to-indigo-100">
                    <div className="max-w-md w-full mx-4 bg-white rounded-2xl shadow-xl p-8">
                        <div className="text-center mb-8">
                            <h1 className="text-3xl font-bold text-gray-900">LiuHao AI-OS</h1>
                            <p className="text-gray-500 mt-2">CEO 控制台</p>
                        </div>

                        {error && (
                            <div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">用户名</label>
                                <input
                                    type="text"
                                    value={username}
                                    onChange={(e) => setUsername(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="输入用户名"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">密码</label>
                                <input
                                    type="password"
                                    value={password}
                                    onChange={(e) => setPassword(e.target.value)}
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    placeholder="输入密码"
                                    required
                                />
                            </div>

                            <button
                                type="submit"
                                disabled={loading}
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-lg transition disabled:opacity-50"
                            >
                                {loading ? '登录中...' : '登录'}
                            </button>
                        </form>

                        <div className="mt-6 text-center text-sm text-gray-500">
                            <p>测试账号: sysadmin / SysAdmin123</p>
                        </div>
                    </div>
                </div>
            );
        }

        // Dashboard Page
        function DashboardPage({ onLogout }) {
            const [activeTab, setActiveTab] = useState('overview');
            const [employees, setEmployees] = useState([]);
            const [health, setHealth] = useState(null);
            const [showModal, setShowModal] = useState(false);

            useEffect(() => {
                loadData();
            }, []);

            const loadData = async () => {
                try {
                    const [empData, healthData] = await Promise.all([
                        api.getEmployees(),
                        api.getHealth()
                    ]);
                    setEmployees(empData);
                    setHealth(healthData);
                } catch (error) {
                    console.error('Failed to load data:', error);
                }
            };

            return (
                <div className="flex h-screen bg-gray-50">
                    {/* Sidebar */}
                    <aside className="w-64 bg-gray-900 text-white flex flex-col">
                        <div className="p-4 border-b border-gray-800">
                            <h1 className="text-xl font-bold">LiuHao AI-OS</h1>
                        </div>

                        <nav className="flex-1 p-4 space-y-2">
                            {[
                                { id: 'overview', name: '总览' },
                                { id: 'employees', name: 'AI 员工' },
                                { id: 'tasks', name: '任务管理' },
                                { id: 'status', name: '系统状态' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`w-full text-left px-4 py-3 rounded-lg transition ${
                                        activeTab === tab.id 
                                            ? 'bg-blue-600 text-white' 
                                            : 'text-gray-300 hover:bg-gray-800'
                                    }`}
                                >
                                    {tab.name}
                                </button>
                            ))}
                        </nav>

                        <div className="p-4 border-t border-gray-800">
                            <button
                                onClick={onLogout}
                                className="w-full px-4 py-3 text-gray-300 hover:bg-gray-800 rounded-lg transition"
                            >
                                退出登录
                            </button>
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 overflow-auto p-8">
                        {activeTab === 'overview' && (
                            <OverviewTab employees={employees} />
                        )}
                        {activeTab === 'employees' && (
                            <EmployeesTab 
                                employees={employees} 
                                onRefresh={loadData}
                                showModal={showModal}
                                setShowModal={setShowModal}
                            />
                        )}
                        {activeTab === 'status' && (
                            <StatusTab health={health} />
                        )}
                        {activeTab === 'tasks' && (
                            <div>
                                <h1 className="text-3xl font-bold text-gray-900 mb-4">任务管理</h1>
                                <p className="text-gray-500">任务功能开发中...</p>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        function OverviewTab({ employees }) {
            return (
                <div>
                    <h1 className="text-3xl font-bold text-gray-900 mb-2">CEO 控制台</h1>
                    <p className="text-gray-500 mb-8">欢迎回来，以下是您的业务概览</p>

                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div className="bg-white rounded-lg shadow p-6">
                            <p className="text-gray-500 text-sm">AI 员工总数</p>
                            <p className="text-3xl font-bold text-gray-900 mt-2">{employees.length}</p>
                        </div>
                        <div className="bg-white rounded-lg shadow p-6">
                            <p className="text-gray-500 text-sm">活跃任务</p>
                            <p className="text-3xl font-bold text-gray-900 mt-2">0</p>
                        </div>
                        <div className="bg-white rounded-lg shadow p-6">
                            <p className="text-gray-500 text-sm">本月营收</p>
                            <p className="text-3xl font-bold text-gray-900 mt-2">$0</p>
                        </div>
                        <div className="bg-white rounded-lg shadow p-6">
                            <p className="text-gray-500 text-sm">系统效率</p>
                            <p className="text-3xl font-bold text-gray-900 mt-2">95%</p>
                        </div>
                    </div>

                    <div className="bg-white rounded-lg shadow">
                        <div className="p-6 border-b border-gray-200">
                            <h2 className="text-xl font-bold text-gray-900">最近的 AI 员工</h2>
                        </div>
                        <div className="p-6">
                            {employees.length > 0 ? (
                                <div className="space-y-4">
                                    {employees.slice(0, 5).map(emp => (
                                        <div key={emp.id} className="flex items-center justify-between py-3 border-b border-gray-100">
                                            <div>
                                                <p className="font-medium text-gray-900">{emp.name}</p>
                                                <p className="text-sm text-gray-500">{emp.position}</p>
                                            </div>
                                            <span className="px-3 py-1 rounded-full text-xs font-medium bg-green-100 text-green-700">
                                                {emp.status}
                                            </span>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <p className="text-gray-500 text-center py-8">暂无 AI 员工</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        function EmployeesTab({ employees, onRefresh, showModal, setShowModal }) {
            return (
                <div>
                    <div className="flex justify-between items-center mb-6">
                        <div>
                            <h1 className="text-3xl font-bold text-gray-900">AI 员工管理</h1>
                            <p className="text-gray-500 mt-2">管理您的 AI 员工团队</p>
                        </div>
                        <button
                            onClick={() => setShowModal(true)}
                            className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
                        >
                            + 添加员工
                        </button>
                    </div>

                    <div className="bg-white rounded-lg shadow overflow-hidden">
                        <table className="min-w-full divide-y divide-gray-200">
                            <thead className="bg-gray-50">
                                <tr>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">名称</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">部门</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">职位</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">状态</th>
                                    <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">创建时间</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {employees.map(emp => (
                                    <tr key={emp.id} className="hover:bg-gray-50">
                                        <td className="px-6 py-4">
                                            <div className="font-medium text-gray-900">{emp.name}</div>
                                            <div className="text-sm text-gray-500">{emp.description.substring(0, 50)}...</div>
                                        </td>
                                        <td className="px-6 py-4 text-sm text-gray-500">{emp.department}</td>
                                        <td className="px-6 py-4 text-sm text-gray-500">{emp.position}</td>
                                        <td className="px-6 py-4">
                                            <span className="px-2 py-1 text-xs font-semibold rounded-full bg-green-100 text-green-800">
                                                {emp.status}
                                            </span>
                                        </td>
                                        <td className="px-6 py-4 text-sm text-gray-500">
                                            {new Date(emp.created_at).toLocaleDateString('zh-CN')}
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>

                    {showModal && <CreateEmployeeModal onClose={() => setShowModal(false)} onSuccess={onRefresh} />}
                </div>
            );
        }

        function CreateEmployeeModal({ onClose, onSuccess }) {
            const [formData, setFormData] = useState({
                name: '',
                department: 'sales',
                position: 'sales_representative',
                description: ''
            });
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState('');

            const handleSubmit = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    await api.createEmployee(formData);
                    onSuccess();
                    onClose();
                } catch (err) {
                    setError(err.response?.data?.error?.message || '创建失败');
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
                    <div className="bg-white rounded-lg p-8 max-w-md w-full mx-4">
                        <h2 className="text-2xl font-bold text-gray-900 mb-6">添加 AI 员工</h2>

                        {error && (
                            <div className="mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm">
                                {error}
                            </div>
                        )}

                        <form onSubmit={handleSubmit} className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">名称</label>
                                <input
                                    type="text"
                                    value={formData.name}
                                    onChange={(e) => setFormData({...formData, name: e.target.value})}
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    required
                                />
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">部门</label>
                                <select
                                    value={formData.department}
                                    onChange={(e) => setFormData({...formData, department: e.target.value})}
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                >
                                    <option value="sales">销售</option>
                                    <option value="marketing">市场</option>
                                    <option value="operations">运营</option>
                                    <option value="engineering">工程</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">职位</label>
                                <select
                                    value={formData.position}
                                    onChange={(e) => setFormData({...formData, position: e.target.value})}
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                >
                                    <option value="sales_representative">销售代表</option>
                                    <option value="marketing_specialist">市场专员</option>
                                    <option value="content_writer">内容撰写</option>
                                    <option value="data_analyst">数据分析</option>
                                </select>
                            </div>

                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">描述</label>
                                <textarea
                                    value={formData.description}
                                    onChange={(e) => setFormData({...formData, description: e.target.value})}
                                    className="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                                    rows="3"
                                    required
                                ></textarea>
                            </div>

                            <div className="flex gap-3 mt-6">
                                <button
                                    type="button"
                                    onClick={onClose}
                                    className="flex-1 px-4 py-2 border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition"
                                >
                                    取消
                                </button>
                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition disabled:opacity-50"
                                >
                                    {loading ? '创建中...' : '创建'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        function StatusTab({ health }) {
            return (
                <div>
                    <h1 className="text-3xl font-bold text-gray-900 mb-6">系统状态</h1>
                    {health && (
                        <div className="bg-white rounded-lg shadow p-6">
                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <p className="text-sm text-gray-500">状态</p>
                                    <p className="text-2xl font-bold text-green-600">{health.status}</p>
                                </div>
                                <div>
                                    <p className="text-sm text-gray-500">版本</p>
                                    <p className="text-2xl font-bold">{health.version}</p>
                                </div>
                                <div>
                                    <p className="text-sm text-gray-500">环境</p>
                                    <p className="text-2xl font-bold">{health.environment}</p>
                                </div>
                                <div>
                                    <p className="text-sm text-gray-500">时间</p>
                                    <p className="text-sm font-mono">{new Date(health.timestamp).toLocaleString('zh-CN')}</p>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Main App
        function App() {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const token = localStorage.getItem('token');
                setIsAuthenticated(!!token);
                setLoading(false);
            }, []);

            const handleLogin = () => setIsAuthenticated(true);
            const handleLogout = () => {
                localStorage.removeItem('token');
                setIsAuthenticated(false);
            };

            if (loading) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-gray-50">
                        <div className="text-xl text-gray-600">加载中...</div>
                    </div>
                );
            }

            return isAuthenticated ? (
                <DashboardPage onLogout={handleLogout} />
            ) : (
                <LoginPage onLogin={handleLogin} />
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
