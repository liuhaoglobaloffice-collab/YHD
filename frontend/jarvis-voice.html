<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiuHao AI-OS - 贾维斯控制台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; }
        * { box-sizing: border-box; }
        
        .voice-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            transition: all 0.3s ease;
        }
        
        .voice-button:hover {
            transform: scale(1.05);
        }
        
        .voice-button.recording {
            animation: pulse 1.5s infinite;
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%) !important;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .waveform {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            height: 40px;
        }
        
        .waveform-bar {
            width: 4px;
            background: white;
            border-radius: 2px;
            animation: wave 1s ease-in-out infinite;
        }
        
        .waveform-bar:nth-child(1) { animation-delay: 0s; }
        .waveform-bar:nth-child(2) { animation-delay: 0.1s; }
        .waveform-bar:nth-child(3) { animation-delay: 0.2s; }
        .waveform-bar:nth-child(4) { animation-delay: 0.3s; }
        .waveform-bar:nth-child(5) { animation-delay: 0.4s; }
        
        @keyframes wave {
            0%, 100% { height: 10px; }
            50% { height: 30px; }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-900 via-blue-900 to-gray-900 min-h-screen text-white">
    <div id="root"></div>

    <script>
        // Microphone recording utility
        let mediaRecorder = null;
        let audioChunks = [];

        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.start();
                return true;
            } catch (error) {
                console.error('录音失败:', error);
                alert('无法访问麦克风，请检查权限设置');
                return false;
            }
        }

        function stopRecording() {
            return new Promise((resolve) => {
                if (!mediaRecorder) {
                    resolve(null);
                    return;
                }
                
                mediaRecorder.onstop = () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    resolve(audioBlob);
                };
                
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
            });
        }

        function playAudio(audioBlob) {
            const audioUrl = URL.createObjectURL(audioBlob);
            const audio = new Audio(audioUrl);
            audio.play();
        }

        // API calls
        async function sendVoiceToJarvis(audioBlob, token) {
            const formData = new FormData();
            formData.append('audio', audioBlob, 'voice.wav');

            const response = await fetch('/api/v1/jarvis/interact', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                },
                body: formData
            });

            if (response.ok) {
                return await response.blob();
            } else {
                throw new Error('Jarvis 响应失败: ' + response.statusText);
            }
        }

        async function getJarvisState(token) {
            const response = await fetch('/api/v1/jarvis/state', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });
            return await response.json();
        }

        // Main App
        function JarvisApp() {
            const [token, setToken] = React.useState(localStorage.getItem('token'));
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [error, setError] = React.useState('');
            const [isRecording, setIsRecording] = React.useState(false);
            const [isProcessing, setIsProcessing] = React.useState(false);
            const [jarvisState, setJarvisState] = React.useState('idle');
            const [transcript, setTranscript] = React.useState('');
            const [response, setResponse] = React.useState('');

            const handleLogin = async (e) => {
                e.preventDefault();
                setError('');
                
                try {
                    const res = await fetch('/api/v1/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username, password })
                    });
                    
                    const data = await res.json();
                    if (res.ok) {
                        localStorage.setItem('token', data.access_token);
                        setToken(data.access_token);
                    } else {
                        setError(data.detail || '登录失败');
                    }
                } catch (err) {
                    setError('网络错误');
                }
            };

            const handleLogout = () => {
                localStorage.removeItem('token');
                setToken(null);
            };

            const handleVoiceClick = async () => {
                if (!token) {
                    alert('请先登录');
                    return;
                }

                if (isRecording) {
                    // 停止录音
                    setIsRecording(false);
                    setIsProcessing(true);
                    setJarvisState('processing');
                    setTranscript('识别中...');

                    const audioBlob = await stopRecording();
                    
                    if (audioBlob) {
                        try {
                            // 发送到 Jarvis
                            const responseAudio = await sendVoiceToJarvis(audioBlob, token);
                            
                            // 播放回复
                            playAudio(responseAudio);
                            setJarvisState('responding');
                            setResponse('正在播放回复...');
                            
                            setTimeout(() => {
                                setJarvisState('idle');
                                setIsProcessing(false);
                            }, 2000);
                            
                        } catch (error) {
                            console.error('处理失败:', error);
                            setError('Jarvis 处理失败: ' + error.message);
                            setJarvisState('error');
                            setIsProcessing(false);
                        }
                    } else {
                        setIsProcessing(false);
                        setJarvisState('idle');
                    }
                } else {
                    // 开始录音
                    const started = await startRecording();
                    if (started) {
                        setIsRecording(true);
                        setJarvisState('listening');
                        setTranscript('正在录音，再次点击停止...');
                        setResponse('');
                        setError('');
                    }
                }
            };

            // 定期更新状态
            React.useEffect(() => {
                if (!token) return;

                const interval = setInterval(async () => {
                    try {
                        const state = await getJarvisState(token);
                        if (state.state !== jarvisState && !isRecording && !isProcessing) {
                            setJarvisState(state.state);
                        }
                    } catch (err) {
                        console.error('状态更新失败:', err);
                    }
                }, 3000);

                return () => clearInterval(interval);
            }, [token, jarvisState, isRecording, isProcessing]);

            if (!token) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4">
                        <div className="bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-md w-full">
                            <div className="text-center mb-8">
                                <h1 className="text-4xl font-bold mb-2">🎤 贾维斯</h1>
                                <p className="text-gray-400">LiuHao AI-OS 语音控制台</p>
                            </div>

                            {error && (
                                <div className="mb-4 bg-red-900 border border-red-700 text-red-200 px-4 py-3 rounded-lg text-sm">
                                    {error}
                                </div>
                            )}

                            <form onSubmit={handleLogin} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium mb-2">用户名</label>
                                    <input
                                        type="text"
                                        value={username}
                                        onChange={(e) => setUsername(e.target.value)}
                                        className="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-white"
                                        required
                                    />
                                </div>

                                <div>
                                    <label className="block text-sm font-medium mb-2">密码</label>
                                    <input
                                        type="password"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        className="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none text-white"
                                        required
                                    />
                                </div>

                                <button
                                    type="submit"
                                    className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition"
                                >
                                    登录
                                </button>
                            </form>

                            <p className="mt-6 text-center text-sm text-gray-400">
                                测试账号: sysadmin / SysAdmin123
                            </p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col items-center justify-center p-4">
                    {/* Header */}
                    <div className="absolute top-4 right-4">
                        <button
                            onClick={handleLogout}
                            className="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition text-sm"
                        >
                            退出登录
                        </button>
                    </div>

                    {/* Status Badge */}
                    <div className="mb-8">
                        <div className={`px-6 py-2 rounded-full text-sm font-medium ${
                            jarvisState === 'idle' ? 'bg-gray-700' :
                            jarvisState === 'listening' ? 'bg-blue-600' :
                            jarvisState === 'processing' ? 'bg-yellow-600' :
                            jarvisState === 'responding' ? 'bg-green-600' :
                            'bg-red-600'
                        }`}>
                            {jarvisState === 'idle' && '🟢 就绪'}
                            {jarvisState === 'listening' && '🎤 监听中'}
                            {jarvisState === 'processing' && '🧠 处理中'}
                            {jarvisState === 'responding' && '🗣️ 回复中'}
                            {jarvisState === 'error' && '❌ 错误'}
                        </div>
                    </div>

                    {/* Main Voice Button */}
                    <div className="mb-12">
                        <button
                            onClick={handleVoiceClick}
                            disabled={isProcessing}
                            className={`voice-button ${isRecording ? 'recording' : ''} ${
                                isProcessing ? 'opacity-50 cursor-not-allowed' : ''
                            } flex items-center justify-center cursor-pointer`}
                            style={{
                                background: isRecording 
                                    ? 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)'
                                    : 'linear-gradient(135deg, #3b82f6 0%, #2563eb 100%)',
                                boxShadow: isRecording 
                                    ? '0 8px 32px rgba(239, 68, 68, 0.5)'
                                    : '0 8px 32px rgba(59, 130, 246, 0.5)'
                            }}
                        >
                            {isRecording ? (
                                <div className="waveform">
                                    <div className="waveform-bar"></div>
                                    <div className="waveform-bar"></div>
                                    <div className="waveform-bar"></div>
                                    <div className="waveform-bar"></div>
                                    <div className="waveform-bar"></div>
                                </div>
                            ) : isProcessing ? (
                                <div className="text-4xl">⏳</div>
                            ) : (
                                <div className="text-4xl">🎤</div>
                            )}
                        </button>
                    </div>

                    {/* Hint Text */}
                    <div className="text-center mb-8">
                        <p className="text-2xl font-semibold mb-2">
                            {isRecording ? '正在录音...' : isProcessing ? '处理中...' : '点击开始对话'}
                        </p>
                        <p className="text-gray-400">
                            {isRecording ? '再次点击停止录音' : '说出 "嘿鎏灏" 或直接说话'}
                        </p>
                    </div>

                    {/* Transcript & Response */}
                    {(transcript || response) && (
                        <div className="max-w-2xl w-full space-y-4">
                            {transcript && (
                                <div className="bg-gray-800 rounded-lg p-6">
                                    <p className="text-sm text-gray-400 mb-2">识别内容:</p>
                                    <p className="text-lg">{transcript}</p>
                                </div>
                            )}
                            {response && (
                                <div className="bg-blue-900 rounded-lg p-6">
                                    <p className="text-sm text-blue-300 mb-2">贾维斯回复:</p>
                                    <p className="text-lg">{response}</p>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Error Message */}
                    {error && (
                        <div className="max-w-2xl w-full mt-4">
                            <div className="bg-red-900 border border-red-700 text-red-200 px-6 py-4 rounded-lg">
                                {error}
                            </div>
                        </div>
                    )}

                    {/* Quick Actions */}
                    <div className="absolute bottom-8 left-1/2 transform -translate-x-1/2">
                        <div className="flex gap-4">
                            <a 
                                href="simple-dashboard.html"
                                className="px-6 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition text-sm"
                            >
                                📊 返回控制台
                            </a>
                            <a 
                                href="/docs"
                                target="_blank"
                                className="px-6 py-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition text-sm"
                            >
                                📖 API 文档
                            </a>
                        </div>
                    </div>
                </div>
            );
        }

        // Render
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(JarvisApp));
    </script>
</body>
</html>
