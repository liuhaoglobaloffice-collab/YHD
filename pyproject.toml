[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liuhao-x"
version = "0.3.0"
description = "LIUHAO X — Human-Sovereign Agent Operating System foundations"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
